<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Controle LED</title>
</head>
<body>
<h1>Controle Arduino</h1>

<div th:if="${status == 'LIGADO'}">
    <img src="https://cdn-icons-png.flaticon.com/512/11913/11913795.png" width="180">
    <p>STATUS: <b>ACESO</b></p>
</div>

<div th:if="${status == 'DESLIGADO'}">
    <img src="https://cdn-icons-png.flaticon.com/512/13/13444.png" width="150">
    <p>STATUS: <b>APAGADO</b></p>
</div>

<form th:action="@{/acao}" method="post">
    <button name="comando" value="1" type="submit">LIGAR</button>
    <button name="comando" value="2" type="submit">DESLIGAR</button>
</form>

<table>
    <tr>
        <th>Ação</th>
        <th>Hora</th>
    </tr>
    <tr th:each="h : ${historico}">
        <td th:text="${h.acao}"></td>
        <td th:text="${#temporals.format(h.dataHora, 'HH:mm:ss')}"></td>
    </tr>
</table>
</body>
</html>
