<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Produto</title>
</head>
<body>
<h1>Cadastro de Produto</h1>
<form method="POST" th:action="@{/produto/salvar}" th:object="${produto}">
    <input type="hidden" th:field="*{id}">

    <label>Nome:</label><br>
    <input type="text" th:field="*{nome}"><br>

    <label>Descrição:</label><br>
    <input type="text" th:field="*{descricao}"><br>

    <label>Valor:</label><br>
    <input type="number" step="0.01" th:field="*{valor}"><br>

    <label>Quantidade:</label><br>
    <input type="number" th:field="*{quantidade}"><br>

    <label>Imagem (URL):</label><br>
    <input type="text" th:field="*{imagem}"><br>

    <label>Categoria:</label><br>
    <select th:field="*{categoria}" required>
        <option value="">Selecione uma categoria</option>
        <option th:each="cat : ${categorias}"
                th:value="${cat.id}"
                th:text="${cat.nome}">
        </option>
    </select><br><br>

    <input type="reset" value="Limpar">
    <input type="submit" value="Salvar Produto">
</form>
<br>
<a href="/produto/listar">Voltar para Lista</a>
</body>
</html>
