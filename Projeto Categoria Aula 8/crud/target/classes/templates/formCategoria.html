<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Formulário Categoria</title></head>
<body>
<form th:action="@{/categoria/salvar}" th:object="${categoria}" method="POST">
    <input type="hidden" th:field="*{id}">
    <label>Nome:</label>
    <input type="text" th:field="*{nome}">
    <button type="submit">Salvar</button>
</form>
</body>
</html>
