<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Lista de Produtos</h1>

<table class="table table-striped">
    <thead>
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Qtd</th>
        <th>Imagem</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produto : ${produtos}">
        <td th:text="${produto.id}"></td>
        <td th:text="${produto.nome}"></td>
        <td th:text="${produto.categoria != null ? produto.categoria.nome : 'Sem Categoria'}"></td>
        <td th:text="${produto.descricao}"></td>
        <td th:text="${produto.valor}"></td>
        <td th:text="${produto.quantidade}"></td>
        <td><img th:src="${produto.imagem}" style="width: 50px"></td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{/produto/editar/{id}(id=${produto.id})}">Editar</a>
            <a class="btn btn-sm btn-danger" th:href="@{/produto/deletar/{id}(id=${produto.id})}">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="mt-3">
    <a class="btn btn-primary" href="/produto/formulario">Novo Produto</a>
    <a class="btn btn-secondary" href="/categoria/listar">Gerenciar Categorias</a>
    <a class="btn btn-outline-dark" href="/">Home</a>
</div>
</body>
</html>
