<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meu gato</title>

    <style>
        img {
            width: 40%;
            animation: animarGato 1s infinite alternate ease-in-out;
        }

        @keyframes animarGato {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.1) rotate(3deg);
            }
        }

        h1 {
            text-align: center;
            color: white;
        }

        body {
            text-align: center;
            background-color: #333333;
        }
    </style>
</head>
<body>

<h1>Meu Gatinho</h1>
<img src="/gato.jpeg">

</body>
</html>
