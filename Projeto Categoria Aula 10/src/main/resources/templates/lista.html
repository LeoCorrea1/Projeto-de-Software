<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estoque</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background: #252525; color: #00d1ff; }
        img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 3px; font-size: 13px; font-weight: bold; }
        .edit { background: #ffc107; color: black; }
        .del { background: #ff4d4d; color: white; }
    </style>
</head>
<body>
<h2>Estoque de Produtos</h2>
<a href="/produto/formulario" style="background: #28a745; color: white; padding: 10px; text-decoration: none; border-radius: 4px; font-weight: bold;">Novo Produto</a>
<a href="/" style="color: #ccc; margin-left: 20px; text-decoration: none;">Voltar Home</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Qtd</th>
        <th>Foto</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${produtos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="${p.categoria != null ? p.categoria.nome : '-'}"></td>
        <td th:text="${'R$ ' + p.valor}"></td>
        <td th:text="${p.quantidade}"></td>
        <td><img th:src="${p.imagem}"></td>
        <td>
            <a th:href="@{/produto/editar/{id}(id=${p.id})}"
               class="btn edit"
               onclick="return confirm('Deseja editar este produto?')">Editar</a>

            <a th:href="@{/produto/deletar/{id}(id=${p.id})}"
               class="btn del"
               onclick="return confirm('Tem certeza que deseja excluir permanentemente este produto?')">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
