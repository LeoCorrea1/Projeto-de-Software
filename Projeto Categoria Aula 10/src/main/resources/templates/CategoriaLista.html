<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #252525; color: #00d1ff; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 13px; display: inline-block; border: none; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-del { background: #dc3545; color: #fff; }
        .btn-new { background: #28a745; color: #fff; margin-bottom: 15px; }
        .btn-home { background: transparent; border: 1px solid #ccc; color: #ccc; margin-left: 10px; }
    </style>
</head>
<body>
<h2>Categorias</h2>
<a href="/categoria/formulario" class="btn btn-new">Nova Categoria</a>
<a href="/" class="btn btn-home">Voltar</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${categorias}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nome}"></td>
        <td>
            <a th:href="@{/categoria/editar/{id}(id=${c.id})}"
               class="btn btn-edit"
               onclick="return confirm('Deseja realmente editar esta categoria?')">Editar</a>

            <a th:href="@{/categoria/deletar/{id}(id=${c.id})}"
               class="btn btn-del"
               onclick="return confirm('Tem certeza que deseja excluir esta categoria permanentemente?')">Excluir</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
