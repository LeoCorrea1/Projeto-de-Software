<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Categorias</title></head>
<body>
<h1>Categorias</h1>
<table>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
    </tr>
    <tr th:each="c : ${categorias}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nome}"></td>
        <td>
            <a th:href="@{/categoria/editar/{id}(id=${c.id})}">Editar</a>
            <a th:href="@{/categoria/deletar/{id}(id=${c.id})}">Excluir</a>
        </td>
    </tr>
</table>
<a href="/categoria/formulario">Nova Categoria</a>
<a href="/">Voltar</a>
</body>
</html>
